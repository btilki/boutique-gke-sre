# Build, scan, sign — WIF authentication (topic 07).
# Full pipeline (Trivy → Artifact Registry → cosign) lands in topic 08.

name: build-scan-sign

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - ".github/workflows/build-scan-sign.yml"

permissions:
  contents: read
  id-token: write

jobs:
  verify-wif:
    name: Verify GCP authentication (WIF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set gcloud project
        run: gcloud config set project boutique-gke

      - name: Verify caller identity
        env:
          EXPECTED_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          # Proves WIF → SA impersonation (uses credentials wired by auth + setup-gcloud)
          gcloud auth print-access-token > /dev/null
          ACTIVE="$(gcloud config get-value account 2>/dev/null)"
          echo "Active account: ${ACTIVE}"
          test "${ACTIVE}" = "${EXPECTED_SA}"
