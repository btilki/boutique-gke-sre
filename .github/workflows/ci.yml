# CI — lint and validate

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  KYVERNO_CLI_VERSION: "1.18.1"
  KUBECONFORM_VERSION: "0.6.7"
  HELM_VERSION: "v3.16.4"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform fmt check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform init and validate
        run: |
          cd terraform/environments/boutique
          terraform init -backend=false
          terraform validate

      - name: Runbook link lint
        run: ./scripts/validate-runbook-links.sh

  kyverno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Kyverno CLI
        run: |
          curl -sLo kyverno.tar.gz \
            "https://github.com/kyverno/kyverno/releases/download/v${KYVERNO_CLI_VERSION}/kyverno-cli_v${KYVERNO_CLI_VERSION}_linux_x86_64.tar.gz"
          tar -xzf kyverno.tar.gz kyverno
          sudo mv kyverno /usr/local/bin/
          kyverno version

      - name: Run Kyverno policy tests
        run: kyverno test tests/kyverno/ --require-tests

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Validate Boutique chart against Kyverno policies
        run: ./tests/manifest/boutique-kyverno.sh

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          curl -sLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: Validate digest-only image values
        run: ./tests/manifest/digest-only.sh

      - name: Validate GitOps manifest schemas
        run: ./tests/manifest/kubeconform.sh
