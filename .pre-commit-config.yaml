# Pre-commit hooks — security and formatting baseline
# Install: pip install pre-commit && brew install terraform-docs && make install-hooks

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        # Helm templates are not valid YAML until rendered (Go template syntax).
        exclude: ^gitops/.+/templates/.*\.yaml$
      - id: check-added-large-files
        args: [--maxkb=500]
        # Browser captures in assets/diagrams/ are intentional operational evidence.
        exclude: ^assets/diagrams/.*\.png$
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          # TF 1.15+: -backend=false belongs on init, not validate
          - --tf-init-args=-backend=false
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yml]
        exclude: ^gitops/.+/templates/.*\.yaml$

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [markdown, yaml]
        exclude: ^gitops/.+/templates/.*\.yaml$
