# Sample ExternalSecret — placeholder only; no real secrets.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: boutique-example-config
  namespace: boutique
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: boutique-example-config
    creationPolicy: Owner
  data:
    - secretKey: EXAMPLE_KEY
      remoteRef:
        key: boutique-example-config
        version: latest
