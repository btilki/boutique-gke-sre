# Argo CD Application for observability stack — enabled in Phase 6.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: boutique-gke-sre
spec:
  project: default
  source:
    repoURL: https://github.com/biroltilki/boutique-gke-sre  # set to actual repo URL
    targetRevision: main
    path: observability
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
