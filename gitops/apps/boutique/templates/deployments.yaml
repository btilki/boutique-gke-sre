{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "boutique.labels" (dict "appLabel" $svc.appLabel "Values" $.Values "Release" $.Release) | nindent 4 }}
spec:
  {{- if not ($svc.autoscaling).enabled }}
  replicas: {{ $svc.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "boutique.selectorLabels" (dict "appLabel" $svc.appLabel "Release" $.Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "boutique.selectorLabels" (dict "appLabel" $svc.appLabel "Release" $.Release) | nindent 8 }}
        app.kubernetes.io/part-of: {{ $.Values.global.partOf }}
    spec:
      {{- with $.Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "boutique.image" (dict "root" $ "imageKey" $name) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          {{- with $.Values.global.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $probePort := default $svc.port $svc.containerPort }}
          ports:
            - name: grpc
              containerPort: {{ default $svc.port $svc.containerPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ default $svc.port $svc.containerPort | quote }}
            {{- if $.Values.global.tracing.enabled }}
            - name: ENABLE_TRACING
              value: "1"
            - name: COLLECTOR_SERVICE_ADDR
              value: {{ $.Values.global.tracing.collectorServiceAddr | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ $name | quote }}
            {{- end }}
            {{- range $key, $value := $svc.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          livenessProbe:
            {{- $liveness := dict "port" $probePort "protocol" $svc.protocol }}
            {{- if $svc.livenessProbe }}
            {{- $_ := set $liveness "livenessPath" $svc.livenessProbe.path }}
            {{- $_ := set $liveness "livenessHeaders" $svc.livenessProbe.httpHeaders }}
            {{- $_ := set $liveness "livenessInitialDelaySeconds" $svc.livenessProbe.initialDelaySeconds }}
            {{- end }}
            {{- include "boutique.livenessProbe" $liveness | nindent 12 }}
          readinessProbe:
            {{- $readiness := dict "port" $probePort "protocol" $svc.protocol }}
            {{- if $svc.readinessProbe }}
            {{- $_ := set $readiness "readinessPath" $svc.readinessProbe.path }}
            {{- $_ := set $readiness "readinessHeaders" $svc.readinessProbe.httpHeaders }}
            {{- $_ := set $readiness "readinessInitialDelaySeconds" $svc.readinessProbe.initialDelaySeconds }}
            {{- end }}
            {{- include "boutique.readinessProbe" $readiness | nindent 12 }}
{{- end }}
