{{- range $name, $svc := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "boutique.labels" (dict "appLabel" $svc.appLabel "Values" $.Values "Release" $.Release) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "boutique.selectorLabels" (dict "appLabel" $svc.appLabel "Release" $.Release) | nindent 4 }}
  ports:
    - name: grpc
      port: {{ $svc.port }}
      targetPort: {{ default $svc.port $svc.containerPort }}
      protocol: TCP
{{- end }}
