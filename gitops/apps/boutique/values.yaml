# Online Boutique Helm values — application configuration.
# Image digests live in values-images.yaml (CI-updated); never use floating tags here.

global:
  partOf: boutique
  imagePullPolicy: IfNotPresent
  # OpenTelemetry — upstream google-cloud-operations pattern (v0.10.5).
  # NetworkPolicy boutique-allow permits OTLP gRPC to observability/otel-collector.
  tracing:
    enabled: true
    collectorServiceAddr: otel-collector.observability.svc:4317
  # Pod hardening — aligned with Online Boutique v0.10.5 upstream manifests.
  podSecurityContext:
    fsGroup: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    privileged: false
    readOnlyRootFilesystem: true

namespace: boutique

ingress:
  enabled: true
  host: boutique.biroltilki.art
  staticIpName: boutique-ingress-ip
  managedCertName: boutique-managed-cert

# Microservice definitions — keys must match values-images.yaml image keys.
services:
  adservice:
    appLabel: adservice
    port: 9555
    protocol: grpc
    replicas: 1
    env: {}
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  cartservice:
    appLabel: cartservice
    port: 7070
    protocol: grpc
    replicas: 1
    env:
      REDIS_ADDR: redis-cart:6379
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  checkoutservice:
    appLabel: checkoutservice
    port: 5050
    protocol: grpc
    replicas: 1
    env:
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      CART_SERVICE_ADDR: cartservice:7070
      CURRENCY_SERVICE_ADDR: currencyservice:7000
      PAYMENT_SERVICE_ADDR: paymentservice:50051
      EMAIL_SERVICE_ADDR: emailservice:5000
      SHIPPING_SERVICE_ADDR: shippingservice:50051
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  currencyservice:
    appLabel: currencyservice
    port: 7000
    protocol: grpc
    replicas: 1
    env:
      DISABLE_PROFILER: "1"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  emailservice:
    appLabel: emailservice
    port: 5000
    containerPort: 8080
    protocol: grpc
    replicas: 1
    env:
      DISABLE_PROFILER: "1"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  frontend:
    appLabel: frontend
    port: 8080
    protocol: http
    replicas: 1
    exposeIngress: true
    env:
      AD_SERVICE_ADDR: adservice:9555
      CART_SERVICE_ADDR: cartservice:7070
      CHECKOUT_SERVICE_ADDR: checkoutservice:5050
      CURRENCY_SERVICE_ADDR: currencyservice:7000
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      RECOMMENDATION_SERVICE_ADDR: recommendationservice:8080
      SHIPPING_SERVICE_ADDR: shippingservice:50051
      SHOPPING_ASSISTANT_SERVICE_ADDR: shoppingassistantservice:80
      ENABLE_PROFILER: "0"
    livenessProbe:
      path: /_healthz
      initialDelaySeconds: 10
      httpHeaders:
        - name: Cookie
          value: shop_session-id=x-liveness-probe
    readinessProbe:
      path: /_healthz
      initialDelaySeconds: 10
      httpHeaders:
        - name: Cookie
          value: shop_session-id=x-readiness-probe
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi

  paymentservice:
    appLabel: paymentservice
    port: 50051
    protocol: grpc
    replicas: 1
    env:
      DISABLE_PROFILER: "1"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  productcatalogservice:
    appLabel: productcatalogservice
    port: 3550
    protocol: grpc
    replicas: 1
    env: {}
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  recommendationservice:
    appLabel: recommendationservice
    port: 8080
    protocol: grpc
    replicas: 1
    env:
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      DISABLE_PROFILER: "1"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  shippingservice:
    appLabel: shippingservice
    port: 50051
    protocol: grpc
    replicas: 1
    env: {}
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

redis:
  name: redis-cart
  port: 6379
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
