# Argo CD UI Ingress — applied in topic 09.
# Requires: GKE GCE Ingress, argocd-ingress-ip (Terraform ingress-edge), argocd-managed-cert.
# Host: https://argocd.boutique.biroltilki.art
# TLS terminates at the GCE load balancer; backend is argocd-server HTTP (port 80, server.insecure).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    # GKE processes Ingress only via this annotation; spec.ingressClassName alone is ignored.
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: argocd-ingress-ip
    networking.gke.io/managed-certificates: argocd-managed-cert
  labels:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: argocd
spec:
  ingressClassName: gce
  rules:
    - host: argocd.boutique.biroltilki.art
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
