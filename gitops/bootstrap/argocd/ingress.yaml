# Placeholder Ingress for Argo CD UI — completed in Phase 4.
# Requires: GKE Ingress controller, static IP, managed certificate (Terraform or GKE).
# Host: https://argocd.boutique.biroltilki.art
# TLS: Google-managed certificate; backend: argocd-server Service (HTTPS or SSL passthrough per install).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    # GKE processes Ingress only via this annotation; spec.ingressClassName alone is ignored.
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: argocd-ingress-ip
    networking.gke.io/managed-certificates: argocd-managed-cert
  labels:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: argocd
spec:
  ingressClassName: gce
  rules:
    - host: argocd.boutique.biroltilki.art
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
