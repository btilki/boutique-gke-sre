# App-of-apps root Application — register once after Argo CD install (Phase 4).
# Child apps live under gitops/apps/argocd-apps/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-root
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: boutique-gke-sre
spec:
  project: default
  source:
    repoURL: https://github.com/btilki/boutique-gke-sre
    targetRevision: main
    path: gitops/apps/argocd-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    # Manual sync only — see ADR 003-manual-argocd-sync
    syncOptions:
      - CreateNamespace=true
