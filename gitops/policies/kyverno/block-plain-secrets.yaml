# Kyverno ClusterPolicy scaffold — block plain Secret resources; use ESO ExternalSecret (Phase 4).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: block-plain-secrets
  annotations:
    policies.kyverno.io/title: Block Plain Secrets
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: block-secret-create
      match:
        any:
          - resources:
              kinds:
                - Secret
              operations:
                - CREATE
                - UPDATE
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - argocd
                - kyverno
                - external-secrets
      validate:
        message: "Plain Secret resources are not allowed. Use ExternalSecret (ESO) instead."
        deny: {}
