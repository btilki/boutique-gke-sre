# Kyverno ClusterPolicy scaffold — block plain Secret resources; use ESO ExternalSecret (Phase 4).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: block-plain-secrets
  annotations:
    policies.kyverno.io/title: Block Plain Secrets
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  # subjects exclude is admission-only; background mode does not support subject selectors.
  background: false
  rules:
    - name: block-secret-create
      match:
        any:
          - resources:
              kinds:
                - Secret
              operations:
                - CREATE
                - UPDATE
      exclude:
        any:
          # Platform namespaces — controllers manage their own Secrets.
          - resources:
              namespaces:
                - kube-system
                - argocd
                - kyverno
                - external-secrets
          # ESO materializes Secrets in app namespaces (e.g. boutique) via this SA.
          - subjects:
              - kind: ServiceAccount
                name: external-secrets
                namespace: external-secrets
      validate:
        message: "Plain Secret resources are not allowed. Use ExternalSecret (ESO) instead."
        deny: {}
