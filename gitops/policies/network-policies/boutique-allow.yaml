# Boutique allow-list NetworkPolicy — east-west paths for all Boutique workloads (Phase 4).
# External storefront traffic: boutique-frontend-ingress.yaml (frontend:8080 only).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: boutique-allow
  namespace: boutique
  labels:
    network-policy.biroltilki.art/tier: application
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: boutique
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # GCP load balancer health checks (required for GCE Ingress)
    - from:
        - ipBlock:
            cidr: 130.211.0.0/22
        - ipBlock:
            cidr: 35.191.0.0/16
    # East-west traffic between Boutique microservices
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: boutique
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: boutique
    # DNS resolution (kube-dns / Cloud DNS sidecar)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
