# Default-deny NetworkPolicy — baseline deny-all per namespace (Phase 4).
# Pair with boutique-allow.yaml; allow rules are additive across policies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: boutique
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
