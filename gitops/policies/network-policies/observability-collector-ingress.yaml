# OTel Collector ingress — allow OTLP from boutique namespace only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-collector-ingress
  namespace: observability
  labels:
    network-policy.biroltilki.art/tier: platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: boutique
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
