# Grafana datasource provisioning — boutique-gke-sre
# Mounted at /etc/grafana/provisioning/datasources/datasources.yaml
# Requires Workload Identity on Grafana SA (roles/monitoring.viewer).
apiVersion: 1
datasources:
  - name: Google Managed Prometheus
    uid: gmp
    type: prometheus
    access: proxy
    isDefault: true
    url: https://monitoring.googleapis.com/v1/projects/boutique-gke/location/global/prometheus
    jsonData:
      httpMethod: POST
      authenticationType: gce
      manageAlerts: false
      prometheusType: Prometheus
      prometheusVersion: 2.40.0

  - name: Cloud Monitoring
    uid: gcm
    type: stackdriver
    access: proxy
    jsonData:
      authenticationType: gce
      defaultProject: boutique-gke
