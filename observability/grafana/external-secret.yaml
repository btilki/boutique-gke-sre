# Grafana admin credentials from GCP Secret Manager (ESO pattern).
# GSM secret `grafana-admin` must be JSON: {"admin-user":"admin","admin-password":"..."}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: boutique-gke-sre
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: grafana-admin
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: grafana-admin
