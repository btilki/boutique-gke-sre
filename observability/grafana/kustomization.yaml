# Grafana bundle — datasource + dashboard provisioning + Deployment (Phase 6 / topic 17).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

labels:
  - pairs:
      app.kubernetes.io/part-of: boutique-gke-sre
    includeSelectors: false

configMapGenerator:
  - name: grafana-datasources
    files:
      - datasources.yaml
  - name: grafana-dashboard-provider
    files:
      - dashboards-provider.yaml
  - name: grafana-dashboards
    files:
      - dashboards/boutique-golden-signals.json
      - dashboards/slo-overview.json

resources:
  - external-secret.yaml
  - deployment.yaml
  - service.yaml
