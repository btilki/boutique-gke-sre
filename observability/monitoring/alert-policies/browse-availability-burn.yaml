# Reference: browse-availability-burn alert policy
# Created via scripts/create-burn-rate-policies.sh — topic 13 step 5.
# Console: https://console.cloud.google.com/monitoring/alerting/policies?project=boutique-gke
#
# SLO: projects/334181791139/services/boutique-frontend/serviceLevelObjectives/browse-availability
# Combiner: OR (any condition fires)
# Notification channels: pagerduty-boutique-production (topic 14)

displayName: browse-availability-burn
combiner: OR
enabled: true

userLabels:
  runbook: browse-availability-burn
  slo: browse-availability

documentation:
  runbook: https://github.com/btilki/boutique-gke-sre/blob/main/docs/sre/runbooks/browse-availability-burn.md

conditions:
  - displayName: Fast burn 1h (page)
    lookback: 3600s
    threshold: 14.4
    response: page
  - displayName: Fast burn 6h (page)
    lookback: 21600s
    threshold: 6.0
    response: page
  - displayName: Slow burn 24h (ticket)
    lookback: 86400s
    threshold: 3.0
    response: ticket
  - displayName: Slow burn 24h slow (ticket)
    lookback: 86400s
    threshold: 1.0
    response: ticket

# API note: burn-rate lookback max 24h; 3d/1x from catalog uses 24h/1x approximation.
