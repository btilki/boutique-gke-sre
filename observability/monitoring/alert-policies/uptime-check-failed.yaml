# Reference: uptime-check-failed alert policy
# Storefront check: scripts/create-uptime-check.sh — topic 13.
# Argo CD check: scripts/create-argocd-uptime-check.sh — topic 18.
#
# Combiner OR: either boutique-storefront or argocd-ui failing pages (after both conditions exist).
# Notification channels: pagerduty-boutique-production (topic 14).

displayName: uptime-check-failed
combiner: OR
enabled: true

userLabels:
  runbook: uptime-check-failed
  targets: boutique-storefront,argocd-ui

documentation:
  runbook: https://github.com/btilki/boutique-gke-sre/blob/main/docs/sre/runbooks/uptime-check-failed.md

conditions:
  - displayName: boutique-storefront uptime check failed
    metric: monitoring.googleapis.com/uptime_check/check_passed
    comparison: COMPARISON_LT
    threshold: 1
    duration: 300s
    alignment: ALIGN_NEXT_OLDER
    reducer: REDUCE_COUNT_FALSE
    check: boutique-storefront

  - displayName: argocd-ui uptime check failed
    metric: monitoring.googleapis.com/uptime_check/check_passed
    comparison: COMPARISON_LT
    threshold: 1
    duration: 300s
    alignment: ALIGN_NEXT_OLDER
    reducer: REDUCE_COUNT_FALSE
    check: argocd-ui
