# OpenTelemetry Collector configuration — boutique-gke-sre
# Mounted via ConfigMap at /etc/otelcol/config.yaml (see kustomization.yaml).
#
# Receivers ingest OTLP from Online Boutique workloads.
# Exporters send traces to Cloud Trace and metrics to Managed Prometheus.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  resource:
    attributes:
      - key: service.namespace
        value: boutique
        action: upsert

exporters:
  # Cloud Trace — requires Workload Identity on collector SA
  googlecloud:
    project: boutique-gke
    trace:
      endpoint: cloudtrace.googleapis.com:443
  # Managed Prometheus — GMP exporter (contrib distribution)
  googlemanagedprometheus:
    project: boutique-gke

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [googlecloud]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [googlemanagedprometheus]
