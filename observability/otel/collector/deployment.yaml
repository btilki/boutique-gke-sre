# OpenTelemetry Collector Deployment — boutique-gke-sre
# Prerequisites:
#   - Namespace: observability (Argo CD CreateNamespace + Kyverno tier label)
#   - ConfigMap otel-collector-config from config.yaml
#   - Workload Identity SA: otel-collector@boutique-gke.iam.gserviceaccount.com
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: boutique-gke-sre
  annotations:
    iam.gke.io/gcp-service-account: otel-collector@boutique-gke.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: boutique-gke-sre
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/component: collector
        app.kubernetes.io/part-of: boutique-gke-sre
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: otel-collector
          # otel/opentelemetry-collector-contrib:0.96.0
          image: otel/opentelemetry-collector-contrib@sha256:ef20ffeb9ae06d75f94bd031cde7713a1d1bcad20e5ebc0f7dc6c2ee52b8ae4a
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 13133
          readinessProbe:
            httpGet:
              path: /
              port: 13133
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
