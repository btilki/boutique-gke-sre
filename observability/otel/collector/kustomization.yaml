# Kustomize bundle for OpenTelemetry Collector (Phase 6, topic 13).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

labels:
  - pairs:
      app.kubernetes.io/part-of: boutique-gke-sre
    includeSelectors: false

configMapGenerator:
  - name: otel-collector-config
    files:
      - config.yaml

resources:
  - deployment.yaml
  - service.yaml
